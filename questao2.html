<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Digite o raio:
    <input type="number" id = "Raio">
    <button onclick="calcular()">click</button>
    <p id = "resultado"></p>

    <script>
        function calcular(){
            let raio = Number(document.getElementById("Raio").value);
            let area = Math.PI * raio * raio;
            document.getElementById("resultado").innerHTML = "a área do circulo é: " + area.toFixed(2);
        }
    </script>
</body>
</html>
