<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id = "resultado"></p>

    <script>
        let soma = 0;
        for(let i = 1; i <= 5; i++){
            let nota = Number(prompt("Digite a nota: "));
            soma = soma + nota;
            document.getElementById("resultado").innerHTML = nota;
        }

        let media = soma / 5;
        document.getElementById("resultado").innerHTML = "A média é " + media;
    </script>
</body>
</html>
