}

function q9(){
    let positivos = 0;
    let negativos = 0;
    let zeros = 0;

    for(let i = 1; i <= 10; i++){
        let numero = Number(prompt("Digite um número:"));

        if(numero > 0){
            positivos++;
        }else if(numero < 0){
            negativos++;
        }else{
            zeros++;
        }
    }

    alert("Positivos: " + positivos);
    alert("Negativos: " + negativos);
    alert("Zeros: " + zeros);
}
